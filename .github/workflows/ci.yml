name: CI and portable release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm validate:source
      - name: Check and build portable ZIP
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Retain build artifacts and dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            artifacts/*/windows-x64-portable/*
            pnpm-lock.yaml
            src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Publish release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Tag and package version do not match.'
          }
          $assets = @(Get-ChildItem "artifacts\$version\windows-x64-portable\*" -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw 'Expected ZIP and SHA256SUMS.txt.' }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "MarkdownEditor $tag" --notes "Windows 11 x64 portable release. Extract the ZIP and run MarkdownEditor.exe. Requires Git for Windows and Microsoft Edge WebView2 Runtime. SHA256SUMS.txt contains the ZIP checksum."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
