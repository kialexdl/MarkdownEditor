[package]
name = "markdown-editor"
version = "0.1.0"
description = "A lightweight workspace-oriented Markdown editor"
authors = ["MarkdownEditor contributors"]
edition = "2021"

[lib]
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
mime_guess = "2"
notify = "8"
open = "5"
percent-encoding = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
